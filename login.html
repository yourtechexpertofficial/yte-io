<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Sign in to Cosvire." />
<title>Sign in — Cosvire</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/main.css" />
</head>
<body>

<div class="gate">
  <aside class="gate__aside">
    <a href="index.html" class="masthead__logo">COSVIRE<i>.</i></a>
    <p class="gate__quote">Six products. One <em>company.</em></p>
    <span class="mono">Parent company — established 2026</span>
  </aside>

  <main class="gate__main">
    <div class="gate__box">
      <span class="mono mono--volt">Members</span>
      <h1>Sign in</h1>
      <p>Access the Cosvire portfolio.</p>

      <form action="#">
        <div class="field">
          <label class="field__label" for="em">Email</label>
          <input class="field__input" type="email" id="em" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label class="field__label" for="pw">Password</label>
          <input class="field__input" type="password" id="pw" placeholder="Enter your password" autocomplete="current-password" required />
        </div>
        <label class="check"><input type="checkbox" /> Keep me signed in for 30 days</label>
        <button type="submit" class="btn btn--volt" style="width:100%;justify-content:center;">Sign in</button>
      </form>

      <p class="gate__foot">No account? <a href="contact.html">Get in touch</a> &nbsp;·&nbsp; <a href="legal.html">Privacy</a></p>
    </div>
  </main>
</div>

<script src="js/main.js"></script>
</body>
</html>
