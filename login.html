<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to the Cosvire ecosystem." />
  <title>Sign In — Cosvire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .login-page canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="login-page">
  <canvas id="particleCanvas"></canvas>

  <div class="login-card">
    <a href="index.html" class="login-logo">
      <span>COSVIRE</span>
      <span class="nav__logo-dot"></span>
    </a>
    <h2>Welcome back</h2>
    <p>Sign in to access the Cosvire ecosystem.</p>

    <div class="social-btns">
      <button class="btn--social">
        <i class="ri-github-fill"></i> GitHub
      </button>
      <button class="btn--social">
        <i class="ri-google-fill"></i> Google
      </button>
    </div>

    <div class="login-divider">or continue with email</div>

    <form action="#">
      <div class="form__row">
        <label class="form__label" for="login-email">Email Address</label>
        <input class="form__input" type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="form__row">
        <label class="form__label" for="login-password">Password</label>
        <input class="form__input" type="password" id="login-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" required />
      </div>
      <label class="form__check">
        <input type="checkbox" /> Remember me for 30 days
      </label>
      <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;">
        Sign In &nbsp;<i class="ri-arrow-right-line"></i>
      </button>
    </form>

    <div class="login-footer">
      Don't have an account? <a href="contact.html">Get in touch</a>
      &nbsp;&middot;&nbsp;
      <a href="legal.html">Privacy Policy</a>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
