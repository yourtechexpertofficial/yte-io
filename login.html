<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to the Cosvire ecosystem." />
  <title>Sign In — Cosvire</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='40' fill='%230d1830'/%3E%3Cpath d='M106.7 151.2A58 58 0 1 1 106.7 52.8L89.8 80A26 26 0 1 0 89.8 124Z' fill='%23fff'/%3E%3Cpath d='M104 110L135 150L177 45' stroke='%23fff' stroke-width='29' fill='none'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

<div class="login-page">

  <!-- Left panel -->
  <aside class="login-side">
    <a href="index.html" class="nav__logo"><svg class="nav__mark" viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" rx="44" fill="#0d1830"/><rect x="2" y="2" width="196" height="196" rx="42" fill="none" stroke="rgba(235,233,226,.16)" stroke-width="2"/><path d="M106.7 151.2A58 58 0 1 1 106.7 52.8L89.8 80A26 26 0 1 0 89.8 124Z" fill="#f5f4ef"/><path d="M104 110L135 150L177 45" stroke="#f5f4ef" stroke-width="29" fill="none"/></svg>COSVIRE<em>.</em></a>
    <p class="login-side__quote">
      Ideas go in.<br />Products come <span class="accent">out.</span>
    </p>
    <span class="mono">The incubation ecosystem / EST. 2026</span>
    <span class="login-side__word" aria-hidden="true">IN</span>
  </aside>

  <!-- Form -->
  <main class="login-form-col">
    <div class="login-box">
      <span class="mono mono--volt">Access / Members</span>
      <h2>Welcome back</h2>
      <p>Sign in to enter the ecosystem.</p>

      <div class="social-btns">
        <button class="btn--social" type="button"><i class="ri-github-fill"></i> GitHub</button>
        <button class="btn--social" type="button"><i class="ri-google-fill"></i> Google</button>
      </div>

      <div class="login-divider">or with email</div>

      <form action="#">
        <div class="form__row">
          <label class="form__label" for="login-email">Email</label>
          <input class="form__input" type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form__row">
          <label class="form__label" for="login-password">Password</label>
          <input class="form__input" type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <label class="form__check">
          <input type="checkbox" /> Keep me signed in for 30 days
        </label>
        <button type="submit" class="btn btn--volt" style="width:100%; justify-content:center;">
          Enter the Ecosystem <i class="ri-arrow-right-line"></i>
        </button>
      </form>

      <p class="login-foot">
        No account yet? <a href="contact.html">Get in touch</a> &nbsp;·&nbsp; <a href="legal.html">Privacy</a>
      </p>
    </div>
  </main>

</div>

<script src="js/main.js"></script>
</body>
</html>
